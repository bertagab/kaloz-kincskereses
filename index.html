<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Kalóz Kincskeresés - Szentendre</title>
  
  <!-- Tailwind CSS & MapLibre GL CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
  
  <!-- React & MapLibre JS (megbízható CDN workerrel) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body, html, #root {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      background-color: #1e1208;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .maplibregl-popup-content {
      background: #fdf6e2 !important;
      color: #2b1a0e !important;
      border: 2px solid #8b5a2b !important;
      border-radius: 12px !important;
      padding: 10px 14px !important;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3) !important;
    }
    .maplibregl-popup-tip {
      border-top-color: #8b5a2b !important;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Szentendre Kacsakő és Duna-parti állomások
    const STATIONS = [
      {
        id: 1,
        title: "1. Állomás: Kacsakő Bisztró",
        coords: [19.0792, 47.6645],
        task: "Itt kezdődik a kaland! Keresd meg a vén kalózok találkozóhelyét a part mentén.",
        clue: "Ahol a kavicsok táncolnak a Duna vizén...",
        code: "KACSA"
      },
      {
        id: 2,
        title: "2. Állomás: A Duna Hullámai",
        coords: [19.0783, 47.6668],
        task: "Figyeld a folyó sodrását! Találd meg a következő nyomot a part menti padok közelében.",
        clue: "Nézz a fűzfák árnyékába!",
        code: "HULLAM"
      },
      {
        id: 3,
        title: "3. Állomás: A Kalóz Kikötő",
        coords: [19.0772, 47.6695],
        task: "Egy régi hajóorr körvonalai sejlenek fel. Keresd meg a titkos jelet!",
        clue: "Ahol a part kövei a legmeredekebbek.",
        code: "KIKOTO"
      },
      {
        id: 4,
        title: "4. Állomás: Az Arany Kincsesláda",
        coords: [19.0758, 47.6718],
        task: "Elértétek a végső helyszínt! Az aranyrögök a homok és fák rejtekében várnak.",
        clue: "Ássatok a kincsesláda közelében!",
        code: "KINCSEK"
      }
    ];

    function App() {
      const mapContainer = useRef(null);
      const mapInstance = useRef(null);
      const markersRef = useRef([]);
      const [currentStation, setCurrentStation] = useState(0);
      const [solved, setSolved] = useState([]);
      const [inputCode, setInputCode] = useState("");
      const [feedback, setFeedback] = useState("");
      const [showChest, setShowChest] = useState(false);

      useEffect(() => {
        if (!mapContainer.current) return;

        // MapLibre inicializálása megbízható, kulcs nélküli vektoros/raszteres stílussal
        const map = new maplibregl.Map({
          container: mapContainer.current,
          style: {
            version: 8,
            sources: {
              'osm-tiles': {
                type: 'raster',
                tiles: [
                  'https://tile.openstreetmap.org/{z}/{x}/{y}.png'
                ],
                tileSize: 256,
                attribution: '&copy; OpenStreetMap közösség'
              }
            },
            layers: [
              {
                id: 'osm-tiles-layer',
                type: 'raster',
                source: 'osm-tiles',
                minzoom: 0,
                maxzoom: 19
              }
            ]
          },
          center: [19.0780, 47.6670],
          zoom: 15,
          maxZoom: 18,
          minZoom: 12
        });

        map.addControl(new maplibregl.NavigationControl(), 'top-right');
        map.addControl(new maplibregl.GeolocateControl({
          positionOptions: { enableHighAccuracy: true },
          trackUserLocation: true
        }), 'top-right');

        map.on('load', () => {
          mapInstance.current = map;
          updateMarkers(0, []);
        });

        return () => map.remove();
      }, []);

      const updateMarkers = (stationIdx, solvedArr) => {
        const map = mapInstance.current;
        if (!map) return;

        // Korábbi markerek eltávolítása
        markersRef.current.forEach(m => m.remove());
        markersRef.current = [];

        STATIONS.forEach((s, idx) => {
          const isCurrent = idx === stationIdx;
          const isDone = solvedArr.includes(s.id);

          const el = document.createElement('div');
          el.className = 'flex items-center justify-center rounded-full shadow-lg font-bold border-2 transition-transform';
          el.style.width = isCurrent ? '38px' : '28px';
          el.style.height = isCurrent ? '38px' : '28px';
          el.style.backgroundColor = isDone ? '#10b981' : isCurrent ? '#f59e0b' : '#6b7280';
          el.style.borderColor = '#ffffff';
          el.style.color = '#ffffff';
          el.style.fontSize = isCurrent ? '16px' : '12px';
          el.innerText = isDone ? '✓' : idx + 1;

          const popup = new maplibregl.Popup({ offset: 25 }).setHTML(`
            <div style="font-weight: bold; font-size: 14px; margin-bottom: 4px;">${s.title}</div>
            <div style="font-size: 12px;">${s.task}</div>
          `);

          const marker = new maplibregl.Marker({ element: el })
            .setLngLat(s.coords)
            .setPopup(popup)
            .addTo(map);

          markersRef.current.push(marker);
        });
      };

      const handleCheckCode = () => {
        const target = STATIONS[currentStation];
        if (inputCode.trim().toUpperCase() === target.code) {
          const newSolved = [...solved, target.id];
          setSolved(newSolved);
          setInputCode("");
          setFeedback("🎉 Bravó, kalóz! Megtaláltad a titkos kódot!");

          if (currentStation + 1 < STATIONS.length) {
            const nextIdx = currentStation + 1;
            setCurrentStation(nextIdx);
            updateMarkers(nextIdx, newSolved);
            mapInstance.current?.flyTo({ center: STATIONS[nextIdx].coords, zoom: 16 });
          } else {
            setShowChest(true);
            updateMarkers(currentStation, newSolved);
          }
        } else {
          setFeedback("❌ Nem jó kód! Keresd tovább a jeleket!");
        }
      };

      const station = STATIONS[currentStation];

      return (
        <div className="flex flex-col h-screen w-full bg-[#1e1208] text-[#f5e6c8]">
          {/* Fejléc */}
          <header className="p-3 bg-[#2b1a0e] border-b border-[#8b5a2b] shadow-md flex items-center justify-between z-10">
            <div className="flex items-center space-x-2">
              <span className="text-2xl">🏴‍☠️</span>
              <div>
                <h1 className="text-base sm:text-lg font-black tracking-wide text-amber-200">KÁCSAKŐ KINCSKERESŐ</h1>
                <p className="text-[11px] text-amber-100/70">Szentendrei kalandok a Duna-parton</p>
              </div>
            </div>
            <div className="text-right">
              <span className="text-xs font-bold text-amber-300">
                {solved.length} / {STATIONS.length} Kész
              </span>
            </div>
          </header>

          {/* Térképnézet */}
          <div className="relative flex-1 w-full">
            <div ref={mapContainer} className="w-full h-full" />
          </div>

          {/* Alsó kártya: Feladat & Kódellenőrzés */}
          <div className="p-4 bg-[#2b1a0e] border-t-2 border-[#8b5a2b] rounded-t-2xl shadow-2xl z-10 max-w-lg mx-auto w-full">
            {!showChest ? (
              <div>
                <div className="flex justify-between items-center mb-1">
                  <span className="text-xs font-bold uppercase tracking-wider text-amber-300">
                    Állomás #{station.id}
                  </span>
                  <span className="text-xs bg-amber-900/60 px-2 py-0.5 rounded border border-amber-500/40 text-amber-200">
                    Kódos feladvány
                  </span>
                </div>
                <h2 className="text-lg font-bold text-white mb-1">{station.title}</h2>
                <p className="text-xs sm:text-sm text-amber-100/90 mb-2">{station.task}</p>
                <div className="bg-[#1a0f06]/80 p-2.5 rounded-lg border border-[#8b5a2b]/40 mb-3">
                  <span className="text-xs font-bold text-amber-400 block mb-0.5">💡 Nyomravezető:</span>
                  <p className="text-xs italic text-amber-200/90">{station.clue}</p>
                </div>

                {/* Kód megadása */}
                <div className="flex gap-2">
                  <input
                    type="text"
                    value={inputCode}
                    onChange={(e) => setInputCode(e.target.value)}
                    placeholder="Állomás kódja..."
                    className="flex-1 bg-[#1e1208] border border-amber-600/60 rounded-xl px-3 py-2 text-sm text-white placeholder-amber-200/40 focus:outline-none focus:border-amber-400"
                  />
                  <button
                    onClick={handleCheckCode}
                    className="bg-amber-600 hover:bg-amber-500 active:scale-95 text-white font-bold px-4 py-2 rounded-xl text-sm transition"
                  >
                    Nyitás
                  </button>
                </div>
                {feedback && (
                  <p className={`text-xs mt-2 font-medium ${feedback.startsWith('🎉') ? 'text-emerald-400' : 'text-rose-400'}`}>
                    {feedback}
                  </p>
                )}
              </div>
            ) : (
              <div className="text-center py-3">
                <div className="text-4xl mb-2 animate-bounce">🏆 🪙</div>
                <h2 className="text-xl font-black text-amber-300 mb-1">MEGTALÁLTÁTOK A KINCSET!</h2>
                <p className="text-xs sm:text-sm text-amber-100/90 mb-3">
                  A Dunai aranyrögök a tiétek! Menjetek vissza a Kacsakőhöz átvenni az arany kavicsokat a ládából!
                </p>
                <button
                  onClick={() => {
                    setSolved([]);
                    setCurrentStation(0);
                    setShowChest(false);
                    setFeedback("");
                    updateMarkers(0, []);
                  }}
                  className="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-5 py-2 rounded-xl text-sm"
                >
                  Újraindítás
                </button>
              </div>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
